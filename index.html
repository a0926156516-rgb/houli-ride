<script>
"use strict";
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const Q=new URLSearchParams(location.search),TS=+Q.get('ts')||1;
let W,H,DPR;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layoutCtl()}
const $=id=>document.getElementById(id);
const COLORS=['#e8483b','#2f8fe0','#3fb85a','#f2b630'],CNAME=['red','blue','green','yellow'];
const VEH={bike:{name:'腳踏車',max:13,acc:3.6,brk:9,turn:1.9,camD:6.5,camZ:2.4,w:2.0},scooter:{name:'機車',max:24,acc:6.5,brk:12,turn:1.55,camD:7.5,camZ:2.6,w:2.0},car:{name:'汽車',max:31,acc:7.5,brk:14,turn:1.15,camD:10,camZ:3.6,w:2.3}};
// ================= WORLD (meters; x east, y north; 后里車站 = origin) =================
const N={ // nodes
 station:[0,0],jiahou:[-400,240],sugar:[-760,520],sanfeng:[-800,120],zhongshe:[-860,-300],west:[-420,-170],
 sishan:[200,-210],horse:[320,-420],trail:[150,-620],brN:[150,-830],brS:[150,-1090],tuN:[150,-1200],tuS:[150,-1470],junc:[150,-1650],green:[1000,-1660],
 forest:[460,80],fuxing:[520,460],taian:[1100,900]};
const EDGES=[ // a,b,type(road|bike|bridge|tunnel),name,bend
 ['station','jiahou','road','甲后路',20],['jiahou','sugar','road','甲后路',-25],['sugar','sanfeng','road','三豐路',30],['sanfeng','zhongshe','road','三豐路',-20],
 ['jiahou','sanfeng','road','三豐路連絡道',10],['station','west','road','公安路',-15],['west','zhongshe','road','三豐路五段',25],
 ['station','sishan','road','寺山路',10],['sishan','horse','road','寺山路',-10],['horse','trail','bike','后豐鐵馬道',15],['trail','brN','bike','后豐鐵馬道',0],
 ['brN','brS','bridge','花梁鋼橋',0],['brS','tuN','bike','后豐鐵馬道',0],['tuN','tuS','tunnel','九號隧道',0],['tuS','junc','bike','后豐鐵馬道',8],['junc','green','bike','東豐自行車綠廊',-60],
 ['station','forest','road','大山路',-15],['forest','fuxing','road','福興路',20],['station','fuxing','road','甲后路一段',-30],['fuxing','taian','road','福興路',-40],['sishan','forest','road','寺山路',20]];
const LM=[ // landmarks: key,name,sub,node/pos,bikeOnly
 {k:'trail',n:'后豐鐵馬道',s:'舊山線鐵道改建的自行車道',p:N.trail,b:1},{k:'bridge',n:'花梁鋼橋',s:'橫跨大甲溪的鋼桁架鐵橋',p:[150,-960],b:1},
 {k:'tunnel',n:'九號隧道',s:'舊鐵道隧道，裡面很暗喔',p:[150,-1335],b:1},{k:'junc',n:'東豐綠廊交會點',s:'后豐鐵馬道 × 東豐自行車綠廊',p:N.junc,b:1},
 {k:'station',n:'后里車站',s:'后里的門戶・台鐵山線',p:[0,25]},{k:'horse',n:'后里馬場',s:'日治時期至今的馬場',p:N.horse},
 {k:'sugar',n:'月眉糖廠',s:'冰棒補給站！還有糖廠小火車',p:N.sugar},{k:'zhongshe',n:'中社觀光花市',s:'四季花海・鬱金香',p:N.zhongshe},
 {k:'forest',n:'花博后里森林園區',s:'1500 多棵老樹的森林綠洲',p:N.forest},{k:'taian',n:'泰安舊火車站',s:'日式木造車站與櫻花',p:N.taian}];
const RIVER=[[-1400,-900],[-700,-930],[0,-950],[150,-960],[600,-985],[1500,-1010]],RIVW=110;
let segs=[],adj={};
function buildGraph(){
 segs=[];adj={};for(const k in N)adj[k]=[];
 EDGES.forEach((e,ei)=>{const A=N[e[0]],B=N[e[1]],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
  const C=[(A[0]+B[0])/2+nx*e[4],(A[1]+B[1])/2+ny*e[4]];const n=Math.max(2,Math.ceil(L/22)),pts=[];
  for(let i=0;i<=n;i++){const t=i/n,u=1-t;pts.push([u*u*A[0]+2*u*t*C[0]+t*t*B[0],u*u*A[1]+2*u*t*C[1]+t*t*B[1]])}
  let len=0;const cum=[0];for(let i=1;i<pts.length;i++){len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);cum.push(len)}
  const E={i:ei,a:e[0],b:e[1],type:e[2],name:e[3],pts,cum,len,hw:e[2]=='road'?5.5:3};EDGES[ei].E=E;
  adj[e[0]].push({e:E,to:e[1],rev:false});adj[e[1]].push({e:E,to:e[0],rev:true});
  for(let i=0;i<pts.length-1;i++)segs.push({E,a:pts[i],b:pts[i+1],k:i});});
}
function edgePoint(E,d){d=Math.max(0,Math.min(E.len,d));let i=1;while(i<E.cum.length-1&&E.cum[i]<d)i++;const t=(d-E.cum[i-1])/(E.cum[i]-E.cum[i-1]||1),a=E.pts[i-1],b=E.pts[i];return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,Math.atan2(b[1]-a[1],b[0]-a[0])]}
function nearest(x,y,filter){let best=null,bd=1e9;for(const s of segs){if(filter&&!filter(s.E))continue;const ax=s.a[0],ay=s.a[1],bx=s.b[0]-ax,by=s.b[1]-ay,l2=bx*bx+by*by;let t=((x-ax)*bx+(y-ay)*by)/l2;t=Math.max(0,Math.min(1,t));const d=Math.hypot(x-ax-bx*t,y-ay-by*t);if(d<bd){bd=d;best=s}}return{s:best,d:bd}}
function riverY(x){for(let i=1;i<RIVER.length;i++)if(x<=RIVER[i][0]){const a=RIVER[i-1],b=RIVER[i],t=(x-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*t}return RIVER[RIVER.length-1][1]}
// ---------- world objects ----------
let OBJ=[],FIELDS=[],ITEMS=[],NPC=[];
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clearOf(x,y,m){const r=nearest(x,y);if(r.d<r.s.E.hw+m)return false;if(Math.abs(y-riverY(x))<RIVW/2+6)return false;return true}
function box(x,y,w,d,h,c,roof,a){OBJ.push({t:'box',x,y,w,d,h,c,roof:roof||shade(c,.8),a:a||0})}
function bb(t,x,y,s){OBJ.push({t,x,y,s:s||1})}
function buildWorld(){
 OBJ=[];FIELDS=[];ITEMS=[];const r=mul(1105);
 // fields
 for(let i=0;i<260;i++){const x=-1300+r()*2700,y=-1800+r()*2900;if(Math.abs(y-riverY(x))<RIVW/2+20)continue;if(Math.hypot(x,y)<260)continue;
  const fl=Math.hypot(x-N.zhongshe[0],y-N.zhongshe[1])<260;const col=fl?['#ff5f9a','#ffd23f','#ff8f3f','#b56cff','#fff3f3'][i%5]:['#6fae44','#88b84c','#5d9c3c','#a6b84a','#7aa84a','#c9b25a'][i%6];
  FIELDS.push({x,y,w:40+r()*80,d:30+r()*70,a:r()*3,c:col,fl})}
 for(let i=0;i<14;i++){const x=N.zhongshe[0]-120+(i%7)*40,y=N.zhongshe[1]+30+Math.floor(i/7)*70;FIELDS.push({x,y,w:30,d:60,a:0,c:['#ff4f8f','#ffd23f','#ff8f3f','#b05fff','#ff7fb0','#fff','#ff3b3b'][i%7],fl:1})}
 // town houses
 for(let i=0;i<220;i++){const a=r()*6.28,rr=40+r()*320,x=Math.cos(a)*rr*1.2,y=Math.sin(a)*rr;if(!clearOf(x,y,7))continue;
  const h=6+r()*12;box(x,y,10+r()*8,10+r()*8,h,['#e8dcc8','#d6cbb8','#efe2d2','#c8bcae','#dfe6e8','#e9d0b0'][i%6],['#a33','#556','#777','#6a4a3a'][i%4],r()*.3)}
 // roadside trees & bushes
 for(const s of segs){const E=s.E;if(s.k%1)continue;const ang=Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0]),nx=-Math.sin(ang),ny=Math.cos(ang);
  for(const sd of[-1,1]){if(r()<(E.type=='road'?.35:.8)){const o=E.hw+4+r()*14,x=s.a[0]+nx*o*sd,y=s.a[1]+ny*o*sd;if(clearOf(x,y,3)&&Math.hypot(x,y)>200)bb(Math.hypot(x-N.taian[0],y-N.taian[1])<300?'sakura':E.type=='road'&&r()<.3?'palm':'tree',x,y,.8+r()*.5)}}}
 // forest park
 for(let i=0;i<120;i++){const x=N.forest[0]+(r()-.5)*260,y=N.forest[1]+40+(r()-.2)*220;if(clearOf(x,y,4))bb(r()<.5?'pine':'tree',x,y,1+r()*.6)}
 for(let i=0;i<8;i++)box(N.forest[0]-60+i*16,N.forest[1]+70,14,3,6,'#8a6a4a','#c9a46a');
 bb('sign',N.forest[0]+12,N.forest[1]+14,1);
 // station
 box(0,40,46,16,11,'#efe8da','#4a6a8a');box(0,40,14,10,16,'#e0d8ca','#3a5a7a');bb('stnsign',0,30,1);
 for(let y=-900;y<1100;y+=40)box(-45,y,3,40,.4,'#6b5b4b','#7a6a5a');// rail line
 // horse farm
 for(let i=0;i<36;i++){const a=i/36*6.283,x=N.horse[0]+60+Math.cos(a)*45,y=N.horse[1]-20+Math.sin(a)*30;box(x,y,8,.5,1.3,'#fff','#fff',a+1.57)}
 for(let i=0;i<7;i++)bb('horse',N.horse[0]+40+r()*45,N.horse[1]-40+r()*40,1);box(N.horse[0]-40,N.horse[1]-40,30,12,7,'#c86a3a','#5a3a2a');bb('sign',N.horse[0]+14,N.horse[1]+12,1);
 // sugar factory
 const S=N.sugar;box(S[0]-40,S[1]+40,50,30,14,'#c8b8a0','#7a5a4a');box(S[0]+20,S[1]+50,30,20,10,'#b8a890','#6a4a3a');box(S[0]-20,S[1]+70,5,5,46,'#a8432f','#802f20');
 bb('smoke',S[0]-20,S[1]+70,1);bb('icesign',S[0]+14,S[1]-10,1);bb('train',S[0]-10,S[1]+18,1);for(let x=-80;x<80;x+=20)box(S[0]+x,S[1]+18,20,1.4,.3,'#555','#666');
 for(let i=0;i<10;i++)bb('palm',S[0]-70+i*16,S[1]-14,1);
 // zhongshe
 for(let i=0;i<4;i++)box(N.zhongshe[0]-100+i*28,N.zhongshe[1]-60,22,40,5,'#dff2ff','#cfeaff');bb('windmill',N.zhongshe[0]+40,N.zhongshe[1]+60,1.4);bb('sign',N.zhongshe[0]+14,N.zhongshe[1]+10,1);
 // taian
 const T=N.taian;box(T[0]+10,T[1]+40,34,12,7,'#7a5a3a','#3a3a4a');box(T[0]+10,T[1]+40,38,15,9,'#5a4030','#2f2f3a');bb('taisign',T[0]+10,T[1]+31,1);
 for(let i=0;i<40;i++){const x=T[0]+(r()-.5)*240,y=T[1]+(r()-.5)*240;if(clearOf(x,y,4))bb('sakura',x,y,1+r()*.5)}
 for(let y=T[1]-200;y<T[1]+300;y+=40)box(T[0]+40,y,3,40,.4,'#6b5b4b','#7a6a5a');
 // bridge truss (red), tunnel walls/portals
 const bE=EDGES[11].E;for(let d=0;d<bE.len;d+=10){const[x,y]=edgePoint(bE,d);for(const sd of[-1,1]){box(x+sd*3.6,y,.6,.6,7,'#b03a2e','#7d2219');box(x+sd*3.6,y-5,.5,10,.5,'#b03a2e','#c04a3e')}box(x,y,8,.5,.5,'#a03028','#c04a3e')}
 for(let d=0;d<bE.len;d+=40){const[x,y]=edgePoint(bE,d);box(x,y,6,4,0,'#555','#555')}
 const tE=EDGES[13].E;for(let d=0;d<=tE.len;d+=10){const[x,y]=edgePoint(tE,d);box(x-4.5,y,2,10,6,'#3b342d','#4a5a3a');box(x+4.5,y,2,10,6,'#3b342d','#4a5a3a');if(d%30==0)bb('lamp',x-3.3,y,1)}
 for(const y of[tE.pts[0][1]+2,tE.pts[tE.pts.length-1][1]-2]){box(150,y,4,2,8,'#8a8070','#9a9080');box(150-5,y,3,2,8,'#8a8070');box(150+5,y,3,2,8,'#8a8070');box(150,y,13,2,1.5,'#8a8070','#9a9080')}
 for(let y=tE.pts[0][1];y>tE.pts[tE.pts.length-1][1];y-=20)for(const sd of[-1,1])box(150+sd*12,y,14,20,8,'#4f7a3a','#5a8a42');
 bb('gate',N.trail[0],N.trail[1]-4,1);bb('jsign',N.junc[0]+10,N.junc[1]+8,1);
 // mountains near (火炎山 north)
 // items
 for(const s of segs){if(r()<.12){const E=s.E;ITEMS.push({x:s.a[0]+(r()-.5)*E.hw,y:s.a[1]+(r()-.5)*E.hw,t:r()<.5?'ice':'water',r:0})}
  if(r()<.07&&s.k>1){const E=s.E;ITEMS.push({x:s.a[0]+(r()-.5)*E.hw,y:s.a[1]+(r()-.5)*E.hw,t:E.type=='road'?(r()<.6?'hole':'dog'):(r()<.5?'duck':'hole'),obs:1})}}
 for(let i=0;i<8;i++)ITEMS.push({x:S[0]-30+i*8,y:S[1]-4,t:'ice',r:0});

function drawBox(o,fd){const ca=Math.cos(o.a),sa=Math.sin(o.a),w=o.w/2,d=o.d/2;const C=[[-w,-d],[w,-d],[w,d],[-w,d]].map(([a,b])=>[o.x+a*ca-b*sa,o.y+a*sa+b*ca]);
 for(const c of C){if(camSpace(c[0],c[1])[1]<NEAR)return}
 const ft=fogT(fd);ctx.globalAlpha=1;const faces=[];
 for(let i=0;i<4;i++){const a=C[i],b=C[(i+1)%4],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,nx=mx-o.x,ny=my-o.y;if(nx*(cam.x-mx)+ny*(cam.y-my)<=0)continue;faces.push([a,b,i])}
 for(const[a,b,i]of faces){const p1=prj(a[0],a[1],0),p2=prj(b[0],b[1],0),p3=prj(b[0],b[1],o.h),p4=prj(a[0],a[1],o.h);ctx.fillStyle=mix(shade(o.c,i%2?.78:.95),FOG,ft);ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.lineTo(p3[0],p3[1]);ctx.lineTo(p4[0],p4[1]);ctx.fill();
  if(o.h>5&&fd<200&&o.w>8){ctx.fillStyle=mix('#5a7a9a',FOG,ft);for(let fl=1;fl<o.h/3.5;fl++){const z=fl*3.3;const q1=prj(a[0]+(b[0]-a[0])*.2,a[1]+(b[1]-a[1])*.2,z),q2=prj(a[0]+(b[0]-a[0])*.8,a[1]+(b[1]-a[1])*.8,z+1.3);ctx.fillRect(Math.min(q1[0],q2[0]),q2[1],Math.abs(q2[0]-q1[0]),q1[1]-q2[1])}}}
 if(cam.z>o.h){ctx.fillStyle=mix(o.roof,FOG,ft);ctx.beginPath();C.forEach((c,i)=>{const p=prj(c[0],c[1],o.h);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});ctx.fill()}}
function drawBB(t,x,y,s,fd,bob){const im=IMG[t];if(!im)return;const p=prj(x,y,(BBZ[t]||0)+(bob||0)),w=BBW[t]*s*F/fd,h=w*im.height/im.width;if(w<1)return;let ox=0;if(t=='train')ox=Math.sin(performance.now()/3000)*w*.3;ctx.drawImage(im,p[0]-w/2+ox,p[1]-h,w,h)}

function drawVeh(v,ch,co,x,y,h,steer,_,fd,sp,me){
 const p=prj(x,y,0);if(!isFinite(p[0]))return;const rel=angd(cam.h,h);// facing relative to camera
 const ww=(v=='npc'?VW.npc[ch]:VW[v])*F/fd;if(ww<1.5)return;
 let frame=0;const ls=me?steer:Math.max(-1,Math.min(1,rel*2));if(ls<-.3)frame=1;else if(ls>.3)frame=2;
 if(v=='bike'&&Math.abs(ls)<=.3&&Math.abs(sp)>.5)frame=3+Math.floor(performance.now()/125*(Math.abs(sp)/8+.4))%4;
 const S=sprFor(v,ch,co,frame,_);
 ctx.save();ctx.translate(p[0],p[1]);
 const facing=Math.cos(rel)<0;// coming toward camera
 if(S){const sc=ww/S.fw,ang=(v=='car'||v=='npc'?0:(me?steer:0)*.12);ctx.rotate(ang);ctx.drawImage(S.im,S.sx,0,S.fw,S.fh,-S.fw/2*sc,-(S.fh-8)*sc,S.fw*sc,S.fh*sc);
  if(facing&&(v=='car'||v=='npc'||v=='scooter')){ctx.fillStyle='rgba(255,250,200,.8)';ctx.beginPath();ctx.arc(-ww*.28,-ww*.2,ww*.05,0,7);ctx.arc(ww*.28,-ww*.2,ww*.05,0,7);ctx.fill()}}
 else{const u=ww/240;ctx.scale(u,u);if(v=='bike'||v=='scooter')riderFB(v,ch,COLORS[co]||'#888',sp,me?steer:0);else carFB(v=='npc'?(ch=='van'?'#ddd':['#c0c4c8','#c9b98f','#5f7480'][_||0]):COLORS[co],v=='npc'&&ch=='van',v=='npc'&&ch=='moto')}
 ctx.restore()}
function riderFB(v,ch,col,sp,lean){const T=ctx,ph=performance.now()/120*(Math.abs(sp)>.5?1:0);T.rotate(lean*.15);
 if(v=='scooter'){T.fillStyle='#222';T.fillRect(-20,-70,40,70);T.fillStyle=shade(col,.8);T.fillRect(-55,-150,110,85);T.fillStyle='#f33';T.fillRect(-40,-110,80,14)}
 else{T.fillStyle='#111';T.fillRect(-9,-120,18,120)}
 const l=Math.sin(ph)*18*(v=='bike'?1:0);T.fillStyle='#3d3550';T.fillRect(-36,-200+l*.5,24,90-l*.5);T.fillRect(12,-200-l*.5,24,90+l*.5);
 T.fillStyle=col;T.beginPath();T.moveTo(-50,-195);T.lineTo(50,-195);T.lineTo(44,-300);T.lineTo(-44,-300);T.fill();T.fillRect(-72,-292,22,70);T.fillRect(50,-292,22,70);
 T.fillStyle='#bbb';T.fillRect(-90,-232,180,8);T.fillStyle='#f2c79a';T.fillRect(-11,-322,22,24);
 T.fillStyle=ch=='f'?'#F07A1E':'#5A3A22';T.beginPath();T.arc(0,-340,34,0,7);T.fill();if(ch=='f'){T.fillRect(-10,-330,20,50)}
 T.fillStyle=col;T.beginPath();T.ellipse(0,-352,40,26,0,Math.PI,0);T.fill()}
function carFB(col,van,moto){const T=ctx;if(moto){riderFB('scooter','m','#7a8a6a',1,0);return}const hgt=van?200:140;T.fillStyle='#111';T.fillRect(-110,-34,40,34);T.fillRect(70,-34,40,34);T.fillStyle=col;T.fillRect(-120,-hgt,240,hgt-20);
 T.fillStyle='#24303a';T.fillRect(-90,-hgt+10,180,van?70:50);T.fillStyle='#d33';T.fillRect(-118,-70,40,18);T.fillRect(78,-70,40,18);T.fillStyle='#eee';T.fillRect(-36,-56,72,20)}
function tag(x,y,v,fd,name,emo){const p=prj(x,y,v=='car'?2.8:2.6);if(fd>220)return;ctx.textAlign='center';if(name){ctx.font='bold 12px sans-serif';const w=ctx.measureText(name).width+10;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(p[0]-w/2,p[1]-16,w,16);ctx.fillStyle='#fff';ctx.fillText(name,p[0],p[1]-4)}

// ---------- HUD ----------
function mmRect(){const r=Math.min(62,W*.17);return{cx:W-r-10,cy:56+r+4,r}}
function hud(){const V=VEH[prof.v];ctx.textAlign='left';ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(8,8,176,prof.v=='bike'?96:78);ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';
 ctx.fillText((mode=='mission'?'⏱ '+fmt(st.time):'🌿 自由騎'),16,28);ctx.fillText((prof.v=='bike'?'🚲 ':prof.v=='scooter'?'🛵 ':'🚗 ')+Math.round(Math.abs(st.sp)*3.6)+' km/h',16,48);
 const lm=lmAt(st.x,st.y);ctx.font='13px sans-serif';ctx.fillText('📍'+(st.edge?(Math.hypot(lm.p[0]-st.x,lm.p[1]-st.y)<60?lm.n:st.edge.name):''),16,68);
 if(mode=='mission'){ctx.fillText('✅ '+missionList().filter(l=>st.visited[l.k]).length+'/'+missionList().length,120,28)}
 if(prof.v=='bike'){ctx.fillText('體力',16,92);ctx.fillStyle='#333';ctx.fillRect(52,82,124,11);ctx.fillStyle=st.stam>30?'#4cd964':'#ff3b30';ctx.fillRect(52,82,124*st.stam/100,11);if(st.stam<=0){ctx.fillStyle='#ff5b50';ctx.fillText('騎不動了…放開踩踏休息或吃冰棒！',12,122)}}
 ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(8,H*0+(prof.v=='bike'?110:92)+(prof.v=='bike'&&st.stam<=0?18:0),176,20);ctx.fillStyle='#bfe';ctx.font='12px sans-serif';ctx.fillText(NET.state=='on'?'🟢 線上 '+NET.tot+' 人'+(NET.shard>1?'・分流'+NET.shard:''):NET.state=='connecting'?'🟡 連線中…（單人遊玩中）':'⚪ 離線單人',14,(prof.v=='bike'?124:106)+(prof.v=='bike'&&st.stam<=0?18:0));
 minimap();compass();junctionHint()}
function minimap(){const{cx,cy,r}=mmRect(),sc=r/520,rot=st.mapNorth?0:(st.ch-Math.PI/2);ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle='rgba(236,232,214,.9)';ctx.fill();ctx.clip();
 const M=(x,y)=>{const dx=(x-st.x)*sc,dy=(y-st.y)*sc,c=Math.cos(-rot),s=Math.sin(-rot);return[cx+dx*c-dy*s,cy-(dx*s+dy*c)]};
 ctx.strokeStyle='#6aaee0';ctx.lineWidth=RIVW*sc;ctx.beginPath();RIVER.forEach((p,i)=>{const q=M(p[0],p[1]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.stroke();
 for(const e of EDGES){const E=e.E;ctx.strokeStyle=E.type=='road'?'#777':E.type=='tunnel'?'#333':E.type=='bridge'?'#c33':'#c8743d';ctx.lineWidth=E.type=='road'?2.5:2;ctx.beginPath();E.pts.forEach((p,i)=>{const q=M(p[0],p[1]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.stroke()}
 for(const l of LM){const q=M(l.p[0],l.p[1]);const inM=missionList().includes(l);ctx.fillStyle=st.visited[l.k]?'#e33':inM?'#fff':'#bbb';ctx.strokeStyle='#a22';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(q[0],q[1],3.5,0,7);ctx.fill();ctx.stroke()}
 for(const o of NET.others.values()){if(o.x==null)continue;const q=M(o.x,o.y);ctx.fillStyle=COLORS[o.co]||'#0af';ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(q[0],q[1],3,0,7);ctx.fill();ctx.stroke()}
 ctx.restore();ctx.save();ctx.translate(cx,cy);ctx.rotate(-(st.h-Math.PI/2)+rot);ctx.fillStyle=COLORS[prof.co];ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(5,6);ctx.lineTo(0,3);ctx.lineTo(-5,6);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
 // north marker
 const na=-rot;ctx.fillStyle='#c22';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('北',cx+Math.sin(na)*(r-8),cy-Math.cos(na)*(r-8)+4);
 ctx.strokeStyle='#654';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(cx-r,cy+r+3,r*2,15);ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.fillText(st.mapNorth?'北方朝上（點地圖切換）':'隨車頭旋轉（點地圖切換）',cx,cy+r+14)}
function compass(){if(mode!='mission')return;const left=missionList().filter(l=>!st.visited[l.k]);if(!left.length)return;let b=null,bd=1e9;for(const l of left){const d=Math.hypot(l.p[0]-st.x,l.p[1]-st.y);if(d<bd){bd=d;b=l}}
 const a=angd(st.h,Math.atan2(b.p[1]-st.y,b.p[0]-st.x)),{cy,r}=mmRect();const x=W/2,y=Math.max(cy+r+40,H*.13);ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.roundRect?ctx.roundRect(-90,-18,180,38,10):ctx.rect(-90,-18,180,38);ctx.fill();
 ctx.save();ctx.translate(-70,1);ctx.rotate(-a);ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(9,9);ctx.lineTo(0,4);ctx.lineTo(-9,9);ctx.fill();ctx.restore();
 ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.fillText(b.n,-52,-1);ctx.font='11px sans-serif';ctx.fillText(Math.round(bd)+' 公尺',-52,14);ctx.restore()}
function junctionHint(){// upcoming intersection: list branches with arrows
 let best=null,bd=1e9;for(const k in N){if(adj[k].length<2)continue;const[r,f]=(()=>{const dx=N[k][0]-st.x,dy=N[k][1]-st.y;return[dx*Math.sin(st.h)-dy*Math.cos(st.h),dx*Math.cos(st.h)+dy*Math.sin(st.h)]})();if(f>-4&&f<70&&Math.abs(r)<20&&f<bd){bd=f;best=k}}
 if(!best)return;const opts=[];for(const a of adj[best]){const p=a.rev?a.e.pts[a.e.pts.length-3]||a.e.pts[0]:a.e.pts[2]||a.e.pts[a.e.pts.length-1];const da=angd(st.h,Math.atan2(p[1]-N[best][1],p[0]-N[best][0]));if(Math.abs(da)>2.6)continue;
  const ok=allowed(a.e);const lm=LM.find(l=>Math.hypot(l.p[0]-N[a.to][0],l.p[1]-N[a.to][1])<60);opts.push({da,txt:(lm?lm.n:a.e.name)+(ok?'':'🚳'),ok})}
 if(opts.length<2)return;opts.sort((a,b)=>b.da-a.da);const y=H*.3,w=Math.min(W-20,opts.length*112);ctx.fillStyle='rgba(20,60,40,.75)';ctx.fillRect(W/2-w/2,y,w,48);ctx.fillStyle='#ffd24a';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('路口 '+Math.max(0,Math.round(bd))+'m',W/2,y-4);
 opts.forEach((o,i)=>{const x=W/2-w/2+(i+.5)*w/opts.length;ctx.save();ctx.translate(x,y+16);ctx.rotate(-o.da);ctx.fillStyle=o.ok?'#fff':'#999';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(8,3);ctx.lineTo(3,3);ctx.lineTo(3,10);ctx.lineTo(-3,10);ctx.lineTo(-3,3);ctx.lineTo(-8,3);ctx.fill();ctx.restore();ctx.fillStyle=o.ok?'#fff':'#aaa';ctx.font='11px sans-serif';ctx.fillText(o.txt.slice(0,8),x,y+42)})}

function drawPrev(){const c=$('prev'),g=c.getContext('2d');g.clearRect(0,0,240,240);const S=sprFor(prof.v,prof.ch,prof.co,0);
 if(S){const sc=Math.min(220/S.fw,220/S.fh);g.drawImage(S.im,S.sx,0,S.fw,S.fh,120-S.fw*sc/2,232-S.fh*sc,S.fw*sc,S.fh*sc)}
