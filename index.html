<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1b3a2a">
<title>后里騎跡 – 台中后里單車之旅</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:rgba(10,25,20,.78);z-index:5;padding:20px;box-sizing:border-box}
.ov.on{display:flex}
.ov h1{font-size:40px;margin:0 0 6px;letter-spacing:4px;text-shadow:0 3px 0 #b5402f}
.ov p{margin:6px 0;line-height:1.6;font-size:15px;max-width:420px}
.btn{margin:10px;padding:14px 34px;font-size:20px;border:0;border-radius:30px;background:#f3a73b;color:#3a1d00;font-weight:bold;box-shadow:0 4px 0 #a5641a;font-family:inherit}
.btn.s{background:#ddd;box-shadow:0 4px 0 #888;font-size:16px;padding:10px 24px}
#hud{position:fixed;top:0;left:0;right:0;z-index:3;pointer-events:none;color:#fff;font-size:14px;text-shadow:0 1px 2px #000}
.tb{position:fixed;z-index:4;width:40px;height:40px;border-radius:20px;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;top:calc(8px + env(safe-area-inset-top))}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:4;background:rgba(120,40,20,.9);color:#fff;padding:10px 22px;border-radius:8px;border:3px solid #f3d38b;font-size:20px;font-weight:bold;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;text-align:center}
#toast small{display:block;font-size:13px;font-weight:normal}
</style></head><body>
<canvas id="c"></canvas>
<button class="tb" id="pauseB" style="right:10px">❚❚</button>
<button class="tb" id="muteB" style="right:56px">🔊</button>
<div id="toast"></div>
<div class="ov on" id="title">
 <h1>后里騎跡</h1><p style="font-size:17px">台中后里・單車漫遊挑戰</p>
 <p>從后豐鐵馬道出發，穿越九號隧道、花梁鋼橋，<br>經后里車站、馬場、月眉糖廠、中社花海、<br>花博森林園區，終點：泰安舊火車站 🌸</p>
 <p style="font-size:13px;opacity:.85">👈👉 左右轉向｜右下「踩踏」加速｜左下「煞車」<br>鍵盤：←→ 轉向、↑/空白 踩踏、↓ 煞車、P 暫停<br>體力歸零會騎不動！吃冰棒🍡、喝水補體力，避開路人、坑洞、鴨子和狗。</p>
 <button class="btn" id="startB">出發！</button><p id="bestT"></p>
</div>
<div class="ov" id="pause"><h1>暫停</h1><button class="btn" id="resB">繼續</button><button class="btn s" id="quitB">回標題</button></div>
<div class="ov" id="result"><h1>抵達泰安！</h1><p id="resTxt"></p><button class="btn" id="againB">再騎一次</button><button class="btn s" id="homeB">回標題</button></div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const Q=new URLSearchParams(location.search),TS=+Q.get('ts')||1;
let W,H,DPR;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
// ---------- ROUTE / ZONES ----------
// map coords: approximate Houli layout (x east, y south) 0..100
const ZONES=[
 {id:'trail',name:'后豐鐵馬道',sub:'舊山線鐵道改建的自行車道',len:2*120,sky:['#7ec8f0','#d8f0ff'],grass:['#5fa845','#58a040'],road:'#8b7d6b',rumble:['#c9b18d','#7d6a50'],map:[50,96]},
 {id:'tunnel',name:'九號隧道',sub:'全長約 500 公尺的舊鐵道隧道',len:2*70,sky:['#111','#222'],grass:['#2a2520','#25201b'],road:'#4a443d',rumble:['#6b5f50','#3c342c'],map:[52,88],dark:1},
 {id:'bridge',name:'花梁鋼橋',sub:'橫跨大甲溪的鋼桁架鐵橋',len:2*90,sky:['#8fd0f5','#e6f6ff'],grass:['#6d8fa8','#6489a3'],road:'#7a5a3a',rumble:['#b03a2e','#7d2219'],map:[53,78],bridge:1},
 {id:'junction',name:'東豐綠廊交會點',sub:'后豐鐵馬道 × 東豐自行車綠廊',len:2*70,sky:['#7ec8f0','#d8f0ff'],grass:['#4f9a3a','#4a9236'],road:'#8b7d6b',rumble:['#e0e0e0','#3a8a3a'],map:[55,68]},
 {id:'town',name:'后里市區・后里車站',sub:'熱鬧的后里街區',len:2*90,sky:['#88c4ec','#e3f2ff'],grass:['#9a9a92','#93938b'],road:'#555',rumble:['#fff','#c33'],map:[50,55]},
 {id:'horse',name:'后里馬場',sub:'看看馬兒在草原上奔跑',len:2*90,sky:['#7ec8f0','#e8f7ff'],grass:['#7cbf4a','#74b744'],road:'#8d6e4c',rumble:['#fff','#8d6e4c'],map:[40,45]},
 {id:'sugar',name:'月眉糖廠',sub:'冰棒補給站！🍡 還有糖廠小火車',len:2*90,sky:['#f3c98b','#fff0d8'],grass:['#8fae4c','#87a646'],road:'#6b5b4b',rumble:['#e9d8b0','#a33'],map:[25,40]},
 {id:'flower',name:'中社花市・花海',sub:'繽紛花田一望無際',len:2*100,sky:['#9fd8ff','#fdf0ff'],grass:['#6fb24a','#68aa44'],road:'#8b7d6b',rumble:['#ff7fb0','#ffe14d'],map:[22,25]},
 {id:'forest',name:'后里花博森林園區',sub:'2018 台中花博森林園區',len:2*100,sky:['#6fb8e0','#cfeedd'],grass:['#3e8a3a','#398236'],road:'#7a6a55',rumble:['#d8c8a0','#5a4a30'],map:[42,28]},
 {id:'taian',name:'泰安舊火車站',sub:'日式木造車站與櫻花道 🌸 終點！',len:2*110,sky:['#ffc8dc','#fff2f6'],grass:['#7fb85a','#78b054'],road:'#8a7a6a',rumble:['#ffb7cf','#fff'],map:[78,22]}
];
const SEG=200,RW=1600,LANES=3,DRAW=180,CAMH=1000,FOV=100,CD=1/Math.tan(FOV/2*Math.PI/180);
let segs=[],trackLen=0,zoneStart=[];
function ease(a,b,p){return a+(b-a)*((-Math.cos(p*Math.PI)/2)+.5)}
function buildTrack(){
 segs=[];let y=0,rnd=mulberry(20261105);
 ZONES.forEach((z,zi)=>{zoneStart[zi]=segs.length;
  // split zone into 3 sub-pieces with random curve & hill
  let n=z.len,parts=3,pl=Math.floor(n/parts);
  for(let p=0;p<parts;p++){
   let curve=(z.tunnel||z.bridge)?(rnd()-.5)*1.2:(rnd()-.5)*6, hill=(z.bridge||z.dark)?0:(rnd()-.5)*(zi==8?60:40);
   if(z.id=='bridge')hill=p==1?0:(p==0?10:-10);
   let y0=y,len=pl+(p==parts-1?n-pl*parts:0);
   for(let i=0;i<len;i++){let t=i/len,c=curve*Math.sin(t*Math.PI);
    y=y0+hill*SEG/10*((-Math.cos(t*Math.PI)/2)+.5);
    segs.push({i:segs.length,z:zi,curve:c,y,sp:[],cars:[],items:[]});}
  }});
 // smooth y as p1/p2
 segs.forEach((s,i)=>{s.p1y=i?segs[i-1].y:0;s.p2y=s.y});
 trackLen=segs.length*SEG;
 decorate(rnd);
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function addSp(i,type,x){if(segs[i])segs[i].sp.push({t:type,x})}
function decorate(r){
 segs.forEach((s,i)=>{const z=ZONES[s.z].id,side=()=>r()<.5?-1:1;
  if(z=='tunnel'){if(i%6==0){addSp(i,'lamp',-1.15);addSp(i,'lamp',1.15)} s.tunnel=1;return}
  if(z=='bridge'){s.bridge=1; if(i%4==0){addSp(i,'truss',-1.2);addSp(i,'truss',1.2)}return}
  if(i%8==0)addSp(i,'sign',side()*1.3);
  if(z=='trail'||z=='junction'){if(i%3==0)addSp(i,r()<.6?'tree':'bush',side()*(1.4+r()*2));}
  if(z=='junction'&&i==zoneStart[3]+20){addSp(i,'jsign',-1.4)}
  if(z=='town'){if(i%4==0)addSp(i,'house',side()*(1.6+r()));if(i%7==0)addSp(i,'scooter',side()*1.25);if(i==zoneStart[4]+45)addSp(i,'station',1.9)}
  if(z=='horse'){if(i%2==0){addSp(i,'fence',-1.2);addSp(i,'fence',1.2)}if(i%9==0)addSp(i,'horse',side()*(1.8+r()*2))}
  if(z=='sugar'){if(i%5==0)addSp(i,'palm',side()*(1.5+r()));if(i==zoneStart[6]+30)addSp(i,'factory',-2.3);if(i==zoneStart[6]+55)addSp(i,'train',2.0);if(i%11==0)addSp(i,'iceshop',1.5)}
  if(z=='flower'){for(let k=0;k<2;k++)addSp(i,'flowers',side()*(1.3+r()*3));}
  if(z=='forest'){if(i%2==0)addSp(i,'pine',side()*(1.4+r()*2.5));if(i%13==0)addSp(i,'bush',side()*1.3)}
  if(z=='taian'){if(i%3==0)addSp(i,'sakura',side()*(1.4+r()*1.8));if(i==segs.length-40)addSp(i,'tstation',-2.0);if(i>segs.length-12&&i<segs.length-9)addSp(i,'goal',0)}
 });
 // items & obstacles
 for(let i=40;i<segs.length-30;i+=14+Math.floor(r()*10)){
  const z=ZONES[segs[i].z].id;let x=(r()*1.4-.7);
  if(z=='sugar')segs[i].items.push({t:'ice',x});else if(r()<.45)segs[i].items.push({t:r()<.5?'water':'ice',x});
  let j=i+7;if(!segs[j])continue;let ox=(r()*1.4-.7),ot;
  if(z=='tunnel'||z=='bridge')ot='hole';else if(z=='horse'||z=='flower')ot=r()<.5?'duck':'hole';else if(z=='town')ot=r()<.5?'dog':'hole';else ot=['hole','duck','dog'][Math.floor(r()*3)];
  segs[j].items.push({t:ot,x:ox,obs:1});
 }
 cyclists=[];for(let k=0;k<22;k++){cyclists.push({z:(0.05+k/22*0.92)*trackLen,x:r()*1.2-.6,sp:1800+r()*1500,col:['#e33','#27f','#fc2','#2b5','#f7a'][k%5]})}
}
let cyclists=[];
// ---------- STATE ----------
const MAXS=SEG*24;let st={};
function reset(){st={pos:0,x:0,speed:0,stam:100,time:0,zone:-1,run:false,hit:0,cool:0,lean:0,pedal:0,auto:!!Q.get('auto'),done:false,col:0,ice:0};buildTrack();}
// ---------- INPUT ----------
const key={};addEventListener('keydown',e=>{key[e.code]=1;if(e.code=='KeyP')togglePause();if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();audio.init()});
addEventListener('keyup',e=>key[e.code]=0);
const touch={l:0,r:0,g:0,b:0};
function btnRects(){const s=Math.min(W,H)*.2,m=14,bot=H-m-s-(H>W?20:0);return{l:[m,bot,s,s],r:[m+s+10,bot,s,s],b:[W-m-s*2-10,bot,s,s],g:[W-m-s,bot-s*.3,s,s*1.3]}}
function updTouch(e){touch.l=touch.r=touch.g=touch.b=0;const R=btnRects();for(const t of e.touches){for(const k in R){const[a,b,w,h]=R[k];if(t.clientX>=a-8&&t.clientX<=a+w+8&&t.clientY>=b-8&&t.clientY<=b+h+8)touch[k]=1}}}
['touchstart','touchmove','touchend','touchcancel'].forEach(n=>cv.addEventListener(n,e=>{e.preventDefault();audio.init();updTouch(e)},{passive:false}));
// mouse fallback for desktop clicking buttons
cv.addEventListener('mousedown',e=>{audio.init();updTouch({touches:[e]})});addEventListener('mouseup',()=>{touch.l=touch.r=touch.g=touch.b=0});
// ---------- AUDIO ----------
const audio={ctx:null,mute:false,amb:null,init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination);this.master.gain.value=this.mute?0:.5;
 const b=this.ctx.createBuffer(1,this.ctx.sampleRate*2,this.ctx.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3}
 const s=this.ctx.createBufferSource();s.buffer=b;s.loop=true;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=600;this.amb=this.ctx.createGain();this.amb.gain.value=0;s.connect(f);f.connect(this.amb);this.amb.connect(this.master);s.start()}catch(e){}},
 tone(f,d,type='sine',v=.2,f2){if(!this.ctx)return;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d)},
 bell(){this.tone(2100,.6,'sine',.25);setTimeout(()=>this.tone(2100,.5,'sine',.2),120)},pedal(){this.tone(180,.05,'triangle',.06)},
 hit(){this.tone(200,.25,'sawtooth',.2,60)},get(){this.tone(880,.1,'square',.1);setTimeout(()=>this.tone(1320,.15,'square',.1),90)},
 setMute(m){this.mute=m;if(this.master)this.master.gain.value=m?0:.5}};
// ---------- UI ----------
const $=id=>document.getElementById(id);let paused=false,toastT=0;
function toast(h){const t=$('toast');t.innerHTML=h;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,2600)}
function fmt(t){const m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+s.toFixed(2)}
function showBest(){const b=+localStorage.getItem('houliBest');$('bestT').textContent=b?('最佳紀錄：'+fmt(b)):''}
function start(){audio.init();reset();st.run=true;paused=false;['title','result','pause'].forEach(i=>$(i).classList.remove('on'));audio.bell()}
function togglePause(){if(!st.run)return;paused=!paused;$('pause').classList.toggle('on',paused)}
$('startB').onclick=start;$('againB').onclick=start;$('resB').onclick=togglePause;
$('quitB').onclick=$('homeB').onclick=()=>{st.run=false;paused=false;$('pause').classList.remove('on');$('result').classList.remove('on');$('title').classList.add('on');showBest()};
$('pauseB').onclick=togglePause;$('muteB').onclick=()=>{audio.init();audio.setMute(!audio.mute);$('muteB').textContent=audio.mute?'🔇':'🔊'};
function finish(){st.run=false;st.done=true;const b=+localStorage.getItem('houliBest');let nb=!b||st.time<b;if(nb)localStorage.setItem('houliBest',st.time.toFixed(2));
 $('resTxt').innerHTML='完成時間：<b style="font-size:26px">'+fmt(st.time)+'</b><br>'+(nb?'🏆 新紀錄！':'最佳紀錄：'+fmt(b))+'<br>收集補給：'+st.col+' 個｜碰撞：'+st.hit+' 次<br>櫻花盛開的泰安舊站到了，辛苦了！';
 $('result').classList.add('on');audio.bell()}
// ---------- UPDATE ----------
function segAt(z){return segs[Math.floor(z/SEG)%segs.length]}
function update(dt){
 if(!st.run||paused)return;st.time+=dt;
 let up=key.ArrowUp||key.Space||key.KeyW||touch.g,dn=key.ArrowDown||key.KeyS||touch.b,L=key.ArrowLeft||key.KeyA||touch.l,R=key.ArrowRight||key.KeyD||touch.r;
 if(st.auto){up=1;L=R=0;// simple autopilot: avoid obstacles ahead, aim at items
  let target=0;const base=Math.floor(st.pos/SEG);for(let k=1;k<14;k++){const s=segs[base+k];if(!s)break;for(const it of s.items){if(it.obs&&Math.abs(it.x-st.x)<.45)target=it.x>0?it.x-.8:it.x+.8;}}
  for(const c of cyclists){const d=c.z-st.pos;if(d>0&&d<SEG*12&&Math.abs(c.x-st.x)<.5)target=c.x>0?c.x-.9:c.x+.9}
  target=Math.max(-.85,Math.min(.85,target));if(target<st.x-.05)L=1;else if(target>st.x+.05)R=1;}
 const seg=segAt(st.pos),ratio=st.speed/MAXS,tired=st.stam<=0;
 const topS=MAXS*(tired?.35:1)*(st.cool>0?.5:1);
 if(up&&!tired||up&&st.speed<topS){st.speed+=MAXS*.45*dt;st.stam-=dt*2.2*(seg.y>seg.p1y?1.6:1);st.pedal+=dt*(2+ratio*8);if(Math.floor(st.pedal*2)!=Math.floor((st.pedal-dt*(2+ratio*8))*2))audio.pedal()}
 else st.speed-=MAXS*.12*dt;
 if(dn)st.speed-=MAXS*1.1*dt;
 st.speed-=(seg.y-seg.p1y)*.25*dt*60; // hills
 st.speed=Math.max(0,Math.min(st.speed,topS));st.stam=Math.max(0,Math.min(100,st.stam+(!up?dt*1.5:0)));
 const dx=dt*2.2*Math.min(1,ratio*1.5+.2);if(L)st.x-=dx;if(R)st.x+=dx;st.lean+=((R?1:0)-(L?1:0)-st.lean)*Math.min(1,dt*8);
 st.x-=dx*ratio*seg.curve*.12; // centrifugal
 const lim=seg.bridge||seg.tunnel?.95:1.6;if(Math.abs(st.x)>1){st.speed-=MAXS*.6*dt*(st.speed>MAXS*.3?1:0)}st.x=Math.max(-lim,Math.min(lim,st.x));
 st.cool=Math.max(0,st.cool-dt);
 st.pos+=st.speed*dt;
 // collisions
 const ps=segAt(st.pos);for(const s of [ps,segs[ps.i+1]]){if(!s)continue;for(const it of s.items){if(it.gone)continue;if(Math.abs(it.x-st.x)<.32){
  if(it.obs){if(st.cool<=0){st.cool=1.2;st.speed*=.4;st.stam-=8;st.hit++;audio.hit();toast(({hole:'哎呀！坑洞！',duck:'嘎嘎！小心鴨子！',dog:'汪汪！有狗！'})[it.t])}}
  else{it.gone=1;st.col++;st.stam=Math.min(100,st.stam+(it.t=='ice'?30:15));audio.get();if(it.t=='ice')st.ice++}}}}
 for(const c of cyclists){c.z+=c.sp*dt;if(c.z>trackLen-SEG*20)c.z=trackLen-SEG*20;const d=c.z-st.pos;if(Math.abs(d)<SEG*.8&&Math.abs(c.x-st.x)<.35&&st.cool<=0){st.cool=1.2;st.speed*=.5;st.stam-=5;st.hit++;audio.hit();audio.bell();toast('叮叮！撞到其他騎士了')}}
 // zones
 const zi=ps.z;if(zi!=st.zone){st.zone=zi;const z=ZONES[zi];toast('📍 '+z.name+'<small>'+z.sub+'</small>');if(zi>0){st.stam=Math.min(100,st.stam+10);audio.bell()}}
 if(audio.amb)audio.amb.gain.value=.05+ratio*.25;
 if(st.pos>=trackLen-SEG*10)finish();
}
// ---------- RENDER ----------
function project(p,cx,cy,cz,cd){p.cx=(p.wx||0)-cx;p.cy=(p.wy||0)-cy;p.cz=p.wz-cz;p.s=cd/p.cz;p.X=Math.round(W/2+p.s*p.cx*W/2);p.Y=Math.round(H/2-p.s*p.cy*H/2);p.Wd=Math.round(p.s*RW*W/2)}
function poly(x1,y1,x2,y2,x3,y3,x4,y4,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill()}
let tm=0;
function render(){
 tm+=1/60;const base=Math.floor(st.pos/SEG),bs=segs[base%segs.length],z=ZONES[bs.z];
 const pp=(st.pos%SEG)/SEG,camY=CAMH+ (bs.p1y+(bs.y-bs.p1y)*pp),cd=CD*(H>W?1.35:1);
 // sky
 const g=ctx.createLinearGradient(0,0,0,H*.6);g.addColorStop(0,z.sky[0]);g.addColorStop(1,z.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(!z.dark)drawBackdrop(z,bs);
 let x=0,dx=-(bs.curve*pp),maxy=H;const list=[];
 for(let n=0;n<DRAW;n++){const s=segs[base+n];if(!s)break;
  const p1={wx:-x,wy:s.p1y,wz:(base+n)*SEG},p2={wx:-x-dx,wy:s.p2y,wz:(base+n+1)*SEG};
  p1.wx=0;p2.wx=0;
